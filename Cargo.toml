[package]
name = "tcslog-sample"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["TCSpecial Team"]
license = "MIT"
repository = "https://github.com/vomlehn/tcslog-sample"
description = "Sample code using tcslog: creates a chain of segment files filled with small ASCII messages"

[dependencies]
tcslog = { git = "https://github.com/vomlehn/tcslog" }
clap = { version = "4", features = ["derive"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
